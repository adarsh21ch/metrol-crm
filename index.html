<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metrol CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Loaded without blocking the first paint. A stylesheet in the head stops
     the browser painting anything until it answers, and a third-party font
     host is exactly the request you cannot rely on being fast. The page now
     renders immediately in the system fallback and swaps when the webfont
     arrives; the stacks in prototype.css all name a real fallback. -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"></noscript>
<!-- SheetJS is ~900KB and only needed if somebody imports an .xlsx.
     It is fetched on demand in src/react/lib/importLeads.ts instead of
     blocking first paint for every visitor. -->
<script>
  // Stamp the theme before first paint so a dark user never sees a white flash.
  try {
    var t = localStorage.getItem('metrol-crm-theme')
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t)
  } catch (e) {}
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/react/main.tsx"></script>
</body>
</html>
